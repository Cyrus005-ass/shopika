name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Mise à jour sans interruption : le kit copié dans chaque front doit être à jour,
      # et toute NOUVELLE migration de base doit rester compatible avec l'ancienne version du code.
      - run: npm run kit:check
      - run: npm run check:migrations

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopika
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: shopika_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U shopika"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://shopika:testpass@localhost:5432/shopika_test
      - run: npm run test

  gate:
    name: Secrets de déploiement présents ?
    runs-on: ubuntu-latest
    outputs:
      vercel: ${{ steps.check.outputs.vercel }}
      migrate: ${{ steps.check.outputs.migrate }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          [ -n "$VERCEL_TOKEN" ] && echo "vercel=true" >> "$GITHUB_OUTPUT" || echo "vercel=false" >> "$GITHUB_OUTPUT"
          [ -n "$PROD_DIRECT_URL" ] && echo "migrate=true" >> "$GITHUB_OUTPUT" || echo "migrate=false" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build API (Vercel)
    needs: [gate, lint-and-typecheck, test]
    if: needs.gate.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_API }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: pr-${{ github.event.pull_request.number }}.shopika-api.vercel.app

  build-admin:
    name: Build Admin Dashboard
    needs: [gate, lint-and-typecheck, test]
    if: needs.gate.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          working-directory: ./shopika-admin
      - run: npm ci
        working-directory: ./shopika-admin
      - run: npm run build
        working-directory: ./shopika-admin
      - name: Le build doit produire sw.js et version.json (mise à jour des utilisateurs)
        run: test -f dist/sw.js && test -f dist/version.json
        working-directory: ./shopika-admin
      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: ./shopika-admin
          alias-domains: pr-${{ github.event.pull_request.number }}.shopika-admin.vercel.app

  build-client:
    name: Build Client Front
    needs: [gate, lint-and-typecheck, test]
    if: needs.gate.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          working-directory: ./shopika-front
      - run: npm ci 2>/dev/null || echo "Static files only"
      - name: Le build doit produire sw.js et version.json (mise à jour des utilisateurs)
        run: node tools/build-update-kit.cjs --prefix shopika-client && test -f sw.js && test -f version.json
        working-directory: ./shopika-front/shopika-front
      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CLIENT }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: ./shopika-front
          alias-domains: pr-${{ github.event.pull_request.number }}.shopika-client.vercel.app

  # Migration de la base AVANT le nouveau code (« expand ») : l'ancienne version continue de
  # fonctionner pendant et après (garanti par `npm run check:migrations`).
  migrate-production:
    name: Migrate Database (production)
    needs: [gate, build-api, build-admin, build-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.gate.outputs.migrate == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

  deploy-production:
    name: Deploy Production
    needs: [gate, build-api, build-admin, build-client, migrate-production]
    if: ${{ always() && !failure() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.gate.outputs.vercel == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_API }}
          vercel-args: '--prod'
      - name: Deploy Admin to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          vercel-args: '--prod'
          working-directory: ./shopika-admin
      - name: Deploy Client to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CLIENT }}
          vercel-args: '--prod'
          working-directory: ./shopika-front

  # Après le déploiement : on vérifie que la nouvelle version répond (API + base de données + fronts).
  # Renseignez les « Variables » du dépôt : PRODUCTION_API_URL, et si vous voulez PRODUCTION_CLIENT_URL,
  # PRODUCTION_MERCHANT_URL, PRODUCTION_ADMIN_URL. Sans PRODUCTION_API_URL, ce contrôle est ignoré.
  smoke-test:
    name: Smoke test (production)
    needs: [deploy-production]
    if: ${{ vars.PRODUCTION_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Vérifier la version en ligne
        env:
          API: ${{ vars.PRODUCTION_API_URL }}
          CLIENT: ${{ vars.PRODUCTION_CLIENT_URL }}
          MERCHANT: ${{ vars.PRODUCTION_MERCHANT_URL }}
          ADMIN: ${{ vars.PRODUCTION_ADMIN_URL }}
        run: |
          args=(--api "$API" --commit "$GITHUB_SHA" --retries 12 --delay 10)
          [ -n "$CLIENT" ] && args+=(--front "$CLIENT")
          [ -n "$MERCHANT" ] && args+=(--front "$MERCHANT")
          [ -n "$ADMIN" ] && args+=(--front "$ADMIN")
          node scripts/smoke-test.js "${args[@]}"
