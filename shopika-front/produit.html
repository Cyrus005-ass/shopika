<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit — Shopika</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/product.css">
</head>
<body>

<div id="site-header"></div>

<main class="product-main" id="productMain">
  <p style="color:var(--color-gray);">…</p>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/product-card.js"></script>
<script src="js/header.js"></script>
<script>
(async () => {
  const productId = new URLSearchParams(location.search).get("id");
  const main = document.getElementById("productMain");
  await Store.primeFavorites();
  const product = await Store.getProductById(productId);

  if (!product) {
    main.innerHTML = `<p style="color:var(--color-gray);" data-i18n="productNotFound">Ce produit n'existe pas ou n'est plus disponible.</p>`;
    applyTranslations();
    return;
  }

  const shop = product.shop;
  const image = product.images && product.images[0] ? product.images[0].url : "";
  main.innerHTML = `
    <div class="product-grid">
      <div class="product-gallery">${image ? `<img src="${image}" alt="${product.name}">` : ""}</div>
      <div>
        <h1 class="product-name">${product.name}</h1>
        <div class="product-price">
          ${formatPrice(product.price)}
          ${product.oldPrice ? `<span class="product-price-old">${formatPrice(product.oldPrice)}</span>` : ""}
        </div>
        ${shop ? `
        <a href="boutique.html?slug=${shop.slug}" class="product-shop-link">
          <strong>${shop.name}</strong>
          <span style="color:var(--color-gray);">· ${shop.city}, ${shop.country}</span>
        </a>` : ""}
        <div class="product-stepper">
          <button type="button" id="qtyMinus">−</button>
          <span id="qtyValue">1</span>
          <button type="button" id="qtyPlus">+</button>
        </div>
        <div class="product-actions">
          <button class="btn-outline-full" id="addToCartBtn" data-i18n="productAddToCart">Ajouter au panier</button>
        <a href="app/panier.html" class="btn-brand-full" id="buyNowBtn" data-i18n="productBuyNow">Acheter maintenant</a>
        </div>
        <p class="product-description">${product.description}</p>
      </div>
    </div>`;

  let qty = 1;
  document.getElementById("qtyMinus").addEventListener("click", () => { qty = Math.max(1, qty - 1); document.getElementById("qtyValue").textContent = qty; });
  document.getElementById("qtyPlus").addEventListener("click", () => { qty++; document.getElementById("qtyValue").textContent = qty; });
  document.getElementById("addToCartBtn").addEventListener("click", () => Store.addToCart(product.id, qty));
  document.getElementById("buyNowBtn").addEventListener("click", () => Store.addToCart(product.id, qty));
  applyTranslations();
})();
</script>
</body>
</html>
