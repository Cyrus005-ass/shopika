<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — Shopika</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/product-card.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body>

<div id="site-header"></div>

<main class="shop-main" id="shopMain">
  <p style="color:var(--color-gray);">…</p>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/product-card.js"></script>
<script src="js/header.js"></script>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get("slug");
  const main = document.getElementById("shopMain");
  await Store.primeFavorites();
  const shop = await Store.getShopBySlug(slug);

  if (!shop) {
    main.innerHTML = `<p style="color:var(--color-gray);" data-i18n="shopNotFound">Cette boutique n'existe pas ou n'est plus disponible.</p>`;
    applyTranslations();
    return;
  }

  const products = await Store.getProductsByShop(shop.id);
  main.innerHTML = `
    <div class="shop-header">
      <div class="shop-header-logo">${shop.name.slice(0, 2).toUpperCase()}</div>
      <div>
        <div class="shop-header-name">${shop.name}</div>
        <div class="shop-header-meta">${shop.city}, ${shop.country} · ${shop.description || ""}</div>
      </div>
    </div>
    <div class="grid" style="display:grid; grid-template-columns:repeat(2,1fr); gap:16px;">
      ${products.length ? products.map(productCardHtml).join("") : `<p style="color:var(--color-gray);" data-i18n="emptyProducts">Aucun produit publié pour l'instant.</p>`}
    </div>`;
  applyTranslations();
})();
</script>
<style>@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr) !important;}}</style>
</body>
</html>
