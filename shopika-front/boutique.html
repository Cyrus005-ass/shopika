<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — Shopika</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-darkbg-32.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<script src="js/favicon.js"></script>
<script src="js/update-manager.js" data-sw="../sw.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/product-card.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body>

<div id="site-header"></div>

<main class="shop-main" id="shopMain">
  <p style="color:var(--color-gray);">…</p>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/product-card.js"></script>
<script src="js/header.js"></script>
<script src="js/storefront.js"></script>
<script>
// Page publique d'une boutique. Le thème (mise en page) est choisi par le marchand
// (shop.themeId). ?theme=1|2|3 force un thème : aperçu depuis l'espace marchand.
(async () => {
  const params = new URLSearchParams(location.search);
  const main = document.getElementById("shopMain");
  const notFound = () => {
    main.innerHTML = `<p style="color:var(--color-gray);" data-i18n="shopNotFound">Cette boutique n'existe pas ou n'est plus disponible.</p>`;
    applyTranslations();
  };
  try {
    await Store.primeFavorites();
    const shop = await Store.getShopBySlug(params.get("slug"));
    if (!shop) return notFound();
    const products = await Store.getProductsByShop(shop.id);

    document.title = shop.name + " — Shopika";
    const root = document.documentElement.style;
    root.setProperty("--shop-primary", Storefront.safeHex(shop.colorPrimary, "#FC0F42"));
    root.setProperty("--shop-secondary", Storefront.safeHex(shop.colorSecondary, "#FE7A1E"));

    await Storefront.mount({ shop, products, root: main, themeId: Storefront.resolveThemeId(shop, params.get("theme")) });
    applyTranslations();
  } catch (err) {
    console.error(err);
    notFound();
  }
})();
</script>
</body>
</html>
