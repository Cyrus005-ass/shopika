<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Se connecter — Shopika</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">shop<span class="brandGradientText">ika</span></div>
    <h1 class="auth-title">Content de vous revoir</h1>
    <p class="auth-subtitle">Connectez-vous pour retrouver votre espace</p>

    <div id="errorBox" class="auth-error" style="display:none;"></div>

    <form id="loginForm" class="auth-form">
      <div class="auth-field"><label>Adresse e-mail</label><input id="email" type="email" placeholder="vous@exemple.com" required></div>
      <div class="auth-field"><label>Mot de passe</label><input id="password" type="password" required></div>
      <button id="submitBtn" class="auth-submit">Se connecter</button>
    </form>

    <p class="auth-footer">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script>
document.documentElement.setAttribute("data-theme", localStorage.getItem("shopika_theme") || "light");

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");
  errorBox.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "Connexion…";
  const email = document.getElementById("email").value.trim();
  try {
    await Auth.login({ email, password: document.getElementById("password").value });
    window.location.href = "app/index.html";
  } catch (err) {
    if (err.code === "EMAIL_NOT_VERIFIED") {
      window.location.href = "verify.html?email=" + encodeURIComponent(email);
      return;
    }
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Se connecter";
  }
});
</script>
</body>
</html>
