<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — Shopika</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-darkbg-32.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<script src="js/favicon.js"></script>
<script src="js/update-manager.js" data-sw="../sw.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">shop<span class="brandGradientText">ika</span></div>
    <h1 class="auth-title">Créez votre compte</h1>
    <p class="auth-subtitle">Un code de vérification vous sera envoyé par e-mail</p>

    <div id="errorBox" class="auth-error" style="display:none;"></div>

    <form id="registerForm" class="auth-form">
      <div class="auth-row2">
        <div class="auth-field"><label>Prénom</label><input id="firstName" required></div>
        <div class="auth-field"><label>Nom</label><input id="lastName" required></div>
      </div>
      <div class="auth-field"><label>Adresse e-mail</label><input id="email" type="email" placeholder="vous@exemple.com" required></div>
      <div class="auth-field"><label>Mot de passe</label><input id="password" type="password" minlength="8" required></div>
      <button id="submitBtn" class="auth-submit">Créer mon compte</button>
    </form>

    <p class="auth-footer">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script>
document.documentElement.setAttribute("data-theme", localStorage.getItem("shopika_theme") || "light");

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");
  errorBox.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "Envoi du code…";
  try {
    const { email } = await Auth.register({
      firstName: document.getElementById("firstName").value.trim(),
      lastName: document.getElementById("lastName").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });
    window.location.href = "verification.html?email=" + encodeURIComponent(email);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Créer mon compte";
  }
});
</script>
</body>
</html>
