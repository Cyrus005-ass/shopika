<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres — Shopika</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/globals.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/app-pages.css">
</head>
<body>

<div class="app-shell">
  <div class="app-shell-backdrop" id="appShellBackdrop"></div>
  <button class="app-hamburger-btn" id="appHamburgerBtn">☰</button>
  <aside class="app-sidebar" id="appSidebar"></aside>
  <main class="app-content">
    <div class="page-main narrow" id="pageMain"></div>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/store.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app-shell.js"></script>
<script>
const user = renderAppShell("parametres");
if (user) {
  document.getElementById("pageMain").innerHTML = `
    <h1 class="page-title" data-i18n="settingsTitle"></h1>
    <form id="pwdForm" class="card form-stack">
      <div style="font-weight:600;" data-i18n="settingsPassword"></div>
      <div id="pwdError" class="error-box" style="display:none;"></div>
      <div id="pwdSuccess" class="success-box" style="display:none;"></div>
      <div class="field"><label data-i18n="settingsCurrentPassword"></label><input id="currentPassword" type="password" required></div>
      <div class="row2">
        <div class="field"><label data-i18n="settingsNewPassword"></label><input id="newPassword" type="password" minlength="8" required></div>
        <div class="field"><label data-i18n="settingsConfirm"></label><input id="confirmPassword" type="password" required></div>
      </div>
      <button class="btn-submit-dark" style="width:fit-content;" id="pwdSubmit" data-i18n="settingsUpdate"></button>
    </form>
    <div class="card toggle-row">
      <div>
        <div class="toggle-label" data-i18n="settings2fa"></div>
        <div class="toggle-hint" data-i18n="settings2faHint"></div>
      </div>
      <button class="toggle ${user.twoFactorOn ? "on" : ""}" id="toggle2fa"><span class="toggle-knob"></span></button>
    </div>`;
  applyTranslations();

  document.getElementById("pwdForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("pwdError");
    const successBox = document.getElementById("pwdSuccess");
    const submitBtn = document.getElementById("pwdSubmit");
    errorBox.style.display = "none";
    successBox.style.display = "none";

    const current = document.getElementById("currentPassword").value;
    const next = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (next !== confirm) {
      errorBox.textContent = getLang() === "fr" ? "Les deux mots de passe ne correspondent pas" : "Passwords do not match";
      errorBox.style.display = "block";
      return;
    }
    submitBtn.disabled = true;
    try {
      // Le mot de passe actuel est vérifié côté serveur (bcrypt) — jamais
      // recalculé ni comparé dans le navigateur.
      await Auth.changePassword({ currentPassword: current, newPassword: next });
      successBox.textContent = getLang() === "fr" ? "Mot de passe mis à jour ✓" : "Password updated ✓";
      successBox.style.display = "block";
      e.target.reset();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
    }
  });

  document.getElementById("toggle2fa").addEventListener("click", async () => {
    const btn = document.getElementById("toggle2fa");
    const next = !user.twoFactorOn;
    btn.disabled = true;
    try {
      const updated = await Auth.updateProfile({ twoFactorOn: next });
      user.twoFactorOn = updated.twoFactorOn;
      btn.classList.toggle("on", user.twoFactorOn);
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
    }
  });
}
</script>
</body>
</html>
