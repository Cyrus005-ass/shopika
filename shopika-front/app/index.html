<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon espace — Shopika</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/globals.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/app-pages.css">
</head>
<body>

<div class="app-shell">
  <div class="app-shell-backdrop" id="appShellBackdrop"></div>
  <button class="app-hamburger-btn" id="appHamburgerBtn">☰</button>
  <aside class="app-sidebar" id="appSidebar"></aside>
  <main class="app-content">
    <div class="page-main" id="pageMain"></div>
  </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/store.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app-shell.js"></script>
<script>
const user = renderAppShell("home");
if (user) {
  document.getElementById("pageMain").innerHTML = `
    <h1 class="page-title"><span data-i18n="dashboardGreeting"></span> ${user.firstName} 👋</h1>
    <p class="page-subtitle" data-i18n="dashboardIntro"></p>
    <div class="dash-grid">
      <div class="dash-card"><div class="dash-card-label" data-i18n="dashboardAccount"></div><div class="dash-card-value">${user.email}</div></div>
      <div class="dash-card"><div class="dash-card-label" data-i18n="dashboardLocation"></div><div class="dash-card-value">${user.city || "—"}, ${user.country || "—"}</div></div>
      <div class="dash-card"><div class="dash-card-label" data-i18n="dashboardLanguage"></div><div class="dash-card-value" id="dashLangValue">${getLang() === "fr" ? "Français" : "English"}</div></div>
    </div>`;
  applyTranslations();
}
document.addEventListener("langchange", () => {
  const el = document.getElementById("dashLangValue");
  if (el) el.textContent = getLang() === "fr" ? "Français" : "English";
});
</script>
</body>
</html>
