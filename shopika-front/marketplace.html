<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace — Shopika</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/marketplace.css">
</head>
<body>

<div id="site-header"></div>

<main class="market-main">
  <h1 class="market-title" data-i18n="marketTitle">Marketplace</h1>
  <p class="market-subtitle" data-i18n="marketSub">Toutes les boutiques disponibles sur Shopika.</p>

  <div class="market-search">
    <span>🔍</span>
    <input type="text" id="marketSearchInput" data-i18n-ph="marketSearchPh" placeholder="Rechercher une boutique ou un produit…">
  </div>

  <div class="shop-grid" id="shopGrid"></div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
<script src="js/marketplace.js"></script>
</body>
</html>
