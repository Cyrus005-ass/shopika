<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification — Shopika</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-darkbg-32.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<script src="js/favicon.js"></script>
<script src="js/update-manager.js" data-sw="../sw.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">shop<span class="brandGradientText">ika</span></div>
    <h1 class="auth-title">Vérifiez votre e-mail</h1>
    <p class="auth-subtitle">Un code à 6 chiffres a été envoyé à <strong id="emailLabel"></strong></p>

    <div id="errorBox" class="auth-error" style="display:none;"></div>
    <div id="infoBox" class="auth-success" style="display:none;"></div>

    <form id="verifyForm" class="auth-form">
      <div class="auth-field">
        <label>Code de vérification</label>
        <input id="codeInput" class="code-input" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
      </div>
      <button id="verifyBtn" class="auth-submit" disabled>Vérifier et créer mon compte</button>
    </form>

    <div class="timer-row">
      <span id="timerCountdown" class="timer-countdown"></span>
      <button id="resendBtn" class="resend-btn" style="display:none;">Renvoyer le code</button>
    </div>

    <a href="inscription.html" class="back-link">← Changer d'adresse e-mail</a>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script>
document.documentElement.setAttribute("data-theme", localStorage.getItem("shopika_theme") || "light");

const params = new URLSearchParams(location.search);
const email = params.get("email");
if (!email) window.location.href = "inscription.html";
document.getElementById("emailLabel").textContent = email;

const codeInput = document.getElementById("codeInput");
const verifyBtn = document.getElementById("verifyBtn");
const errorBox = document.getElementById("errorBox");
const infoBox = document.getElementById("infoBox");
const timerCountdown = document.getElementById("timerCountdown");
const resendBtn = document.getElementById("resendBtn");

codeInput.addEventListener("input", () => {
  codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
  verifyBtn.disabled = codeInput.value.length !== 6;
});

let secondsLeft = 120;
let timerId = null;
function startTimer(seconds) {
  secondsLeft = seconds;
  clearInterval(timerId);
  updateTimerDisplay();
  timerId = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) clearInterval(timerId);
  }, 1000);
}
function updateTimerDisplay() {
  if (secondsLeft > 0) {
    timerCountdown.style.display = "inline";
    timerCountdown.textContent = `Vous pourrez demander un nouveau code dans ${secondsLeft}s`;
    resendBtn.style.display = "none";
  } else {
    timerCountdown.style.display = "none";
    resendBtn.style.display = "inline";
  }
}
startTimer(120);

document.getElementById("verifyForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.style.display = "none";
  infoBox.style.display = "none";
  verifyBtn.disabled = true;
  verifyBtn.textContent = "Vérification…";
  try {
    await Auth.verifyEmail({ email, code: codeInput.value });
    window.location.href = "app/index.html";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
    if (err.expired) startTimer(0);
    verifyBtn.disabled = codeInput.value.length !== 6;
    verifyBtn.textContent = "Vérifier et créer mon compte";
  }
});

resendBtn.addEventListener("click", async () => {
  errorBox.style.display = "none";
  infoBox.style.display = "none";
  resendBtn.disabled = true;
  resendBtn.textContent = "Envoi…";
  try {
    await Auth.resendCode(email);
    infoBox.textContent = "Un nouveau code vient d'être envoyé.";
    infoBox.style.display = "block";
    codeInput.value = "";
    verifyBtn.disabled = true;
    startTimer(120);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
    if (err.secondsRemaining) startTimer(err.secondsRemaining);
  } finally {
    resendBtn.disabled = false;
    resendBtn.textContent = "Renvoyer le code";
  }
});
</script>
</body>
</html>
